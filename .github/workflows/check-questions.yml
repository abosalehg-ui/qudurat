name: check-questions

on:
  push:
    branches: [main]
    paths: ['index.html', 'scripts/**']
  pull_request:
    paths: ['index.html', 'scripts/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: فحص سلامة قاعدة الأسئلة
        run: node scripts/check-questions.mjs
