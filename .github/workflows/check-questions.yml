name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: فحص سلامة قاعدة الأسئلة
        run: node scripts/check-questions.mjs
      - name: اختبارات الوحدات
        run: node --test tests/*.test.cjs
